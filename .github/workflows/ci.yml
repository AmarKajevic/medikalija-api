name: CI

# Deploy (CD) radi Vercel Git integracija: preview za svaki PR, produkcija za
# push na main. Ovaj workflow je kapija pre merge-a — branch protection na main
# treba da zahteva proveru "CI OK".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: node --check
        run: git ls-files '*.js' | xargs -n1 node --check

  test:
    name: Tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Računanje perioda specifikacija ne sme da zavisi od zone servera:
        # Vercel radi u UTC, lokalni razvoj u Beogradu.
        tz: [UTC, Europe/Belgrade, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  ci-ok:
    name: CI OK
    if: always()
    needs: [syntax, test]
    runs-on: ubuntu-latest
    steps:
      - name: Svi poslovi moraju da prođu
        run: |
          echo '${{ toJSON(needs) }}'
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "false" ]]
